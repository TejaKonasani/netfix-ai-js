<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NETFIX AI — Smarter Law. Stronger Decisions. | MARG GROUP</title>
    <meta name="description" content="AI-powered intelligence for Tax, Legal, Litigation, Corporate, Property, Projects and Compliance." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind Play CDN (no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              background: {
                DEFAULT: '#050B14',
                darker: '#030712',
                surface: '#081525',
                card: 'rgba(10, 22, 40, 0.75)',
              },
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                cyan: '#00D2FF',
                blue: '#0070F3',
                electric: '#00A3FF',
              },
            },
            boxShadow: {
              glass: '0 8px 32px 0 rgba(0, 0, 0, 0.45)',
              'glass-hover': '0 12px 40px 0 rgba(0, 163, 255, 0.18)',
              'cyan-glow': '0 0 25px rgba(0, 210, 255, 0.35)',
              'blue-glow': '0 0 30px rgba(0, 112, 243, 0.3)',
            },
            backdropBlur: {
              xs: '2px',
              '2xl': '24px',
              '3xl': '32px',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              float: 'float 6s ease-in-out infinite',
              'float-slow': 'float 9s ease-in-out infinite',
              glow: 'glow 3s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                '0%': { opacity: '0.4' },
                '100%': { opacity: '0.8' },
              },
            },
          },
        },
      };
    </script>

    <!-- Lucide icons (replaces lucide-react) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Custom styles (converted from index.css) -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-[#050B14] text-slate-100 font-sans">
    <!-- App root — the JS router renders here -->
    <div id="app" class="w-full min-h-screen flex flex-col"></div>

    <!-- App scripts -->
    <script src="/js/landingData.js"></script>
    <script src="/js/authService.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
